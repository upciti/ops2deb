[project]
name = "ops2deb"
version = "0"
description = "Build debian packages"
authors = [{ name = "Upciti", email = "support@upciti.com" }]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "Debian",
    "DevOps",
    "Automation",
    "Kubernetes",
    "APT",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.20.0",
    "semver==3.0.2",
    "ruamel.yaml==0.18.17",
    "python-debian>=0.1.42",
    "PyYAML>=6,<7",
    "typer>=0.6.1",
    "aiofiles>=0.1.9",
    "Jinja2>=3,<4",
    "pydantic>=2,<3",
    "unix-ar>=0.2.1,<0.3",
    "rich",
    "dirsync>=2.2.5,<3",
    "zstandard",
]

[project.optional-dependencies]
pyinstaller = ["pyinstaller==6.22.3"]

[project.urls]
Repository = "https://github.com/upciti/ops2deb"

[project.scripts]
ops2deb = "ops2deb.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "taskipy",
    "pytest-cov",
    "safety",
    "types-aiofiles",
    "types-PyYAML",
    "pytest-asyncio>=0.18.0",
    "fastapi>=0.100",
    "ruff",
]

[tool.taskipy.tasks]
check = """
 ruff src tests --fix\
 && ruff format src tests\
 && mypy src\
 && pytest --cov src tests\
"""
single_binary_application = """
pyinstaller --onefile src/ops2deb/__main__.py --name ops2deb -s
"""

[tool.mypy]
files = "src"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ['unix_ar', "dirsync"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/ops2deb/templates.py" = ["E501", "W191"]
